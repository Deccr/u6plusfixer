<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="U6+ UART header pinout and wiring to a USB-serial adapter">
  <title>U6+ UART header pinout and wiring to a USB-serial adapter</title>
  <rect x="0.5" y="0.5" width="759" height="429" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#1f2328">U6+ UART header → USB-serial adapter</text>
  <text x="32" y="70" font-size="14" fill="#59636e">115200 baud, 8N1, 3.3 V logic. Connect RX, TX and GND only: AP RX to adapter TX, AP TX to adapter RX.</text>

  <!-- PCB edge with the header -->
  <path d="M32 96 H262 Q290 96 290 124 V372 Q290 400 262 400 H32 Z" fill="#14532d"/>
  <text x="246" y="126" font-size="13" font-weight="700" fill="#e6f4ea" text-anchor="middle" letter-spacing="1">UART</text>
  <!-- pads -->
  <rect x="233" y="145" width="26" height="26" rx="2" fill="#d4a72c"/>
  <circle cx="246" cy="208" r="13" fill="#d4a72c"/><circle cx="246" cy="208" r="5" fill="#0b2e1a"/>
  <circle cx="246" cy="258" r="13" fill="#d4a72c"/><circle cx="246" cy="258" r="5" fill="#0b2e1a"/>
  <circle cx="246" cy="308" r="13" fill="#d4a72c"/><circle cx="246" cy="308" r="5" fill="#0b2e1a"/>
  <rect x="241" y="153" width="10" height="10" fill="#0b2e1a"/>
  <!-- pad labels -->
  <text x="220" y="156" font-size="14" font-weight="700" fill="#fecaca" text-anchor="end">1  VCC 3.3 V</text>
  <text x="220" y="173" font-size="12" fill="#fecaca" text-anchor="end">square pad · do not connect</text>
  <text x="220" y="213" font-size="14" font-weight="700" fill="#ffffff" text-anchor="end">2  RX</text>
  <text x="220" y="263" font-size="14" font-weight="700" fill="#ffffff" text-anchor="end">3  TX</text>
  <text x="220" y="313" font-size="14" font-weight="700" fill="#ffffff" text-anchor="end">4  GND</text>
  <text x="48" y="370" font-size="12" fill="#bbe5c8">AP mainboard, board edge</text><text x="48" y="387" font-size="12" fill="#bbe5c8">(header is unpopulated)</text>

  <!-- wires -->
  <path d="M259 208 C380 208 360 186 470 186" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <path d="M259 258 C380 258 360 236 470 236" fill="none" stroke="#ca8a04" stroke-width="5" stroke-linecap="round"/>
  <path d="M259 308 C380 308 360 286 470 286" fill="none" stroke="#1f2328" stroke-width="5" stroke-linecap="round"/>
  <text x="365" y="182" font-size="12" fill="#15803d" text-anchor="middle">AP RX ← adapter TX</text>
  <text x="365" y="276" font-size="12" fill="#a16207" text-anchor="middle" dy="-44">AP TX → adapter RX</text>
  <text x="365" y="330" font-size="12" fill="#1f2328" text-anchor="middle">GND ↔ GND</text>

  <!-- adapter -->
  <rect x="470" y="130" width="250" height="230" rx="12" fill="#1e3a8a"/>
  <text x="595" y="158" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">USB-serial adapter (3.3 V)</text>
  <rect x="462" y="178" width="16" height="16" rx="2" fill="#d4a72c"/>
  <rect x="462" y="228" width="16" height="16" rx="2" fill="#d4a72c"/>
  <rect x="462" y="278" width="16" height="16" rx="2" fill="#d4a72c"/>
  <rect x="462" y="318" width="16" height="16" rx="2" fill="#94a3b8"/>
  <text x="492" y="191" font-size="14" font-weight="700" fill="#ffffff">TXD</text>
  <text x="492" y="241" font-size="14" font-weight="700" fill="#ffffff">RXD</text>
  <text x="492" y="291" font-size="14" font-weight="700" fill="#ffffff">GND</text>
  <text x="492" y="331" font-size="14" fill="#cbd5e1">VCC  (leave unconnected)</text>
  <path d="M444 318 l12 12 m0 -12 l-12 12" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>

  <text x="32" y="420" font-size="12" fill="#59636e">No output on the console? Swap RX and TX. Pin order confirmed on our units: VCC (square), RX, TX, GND.</text>
</svg>
