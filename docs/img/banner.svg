  <rect width="960" height="220" rx="18" fill="#0d1117"/>
  <!-- access point disc -->
  <circle cx="150" cy="110" r="74" fill="#f6f8fa"/>
  <circle cx="150" cy="110" r="74" fill="none" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="150" cy="110" r="44" fill="none" stroke="#e5e7eb" stroke-width="2"/>
  <circle cx="150" cy="110" r="9" fill="#2f81f7"/>
  <circle cx="150" cy="110" r="18" fill="none" stroke="#2f81f7" stroke-width="3" opacity="0.55"/>
  <circle cx="150" cy="110" r="28" fill="none" stroke="#2f81f7" stroke-width="2" opacity="0.25"/>
