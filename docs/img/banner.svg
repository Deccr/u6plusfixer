<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="U6+ eMMC Recovery: bring bricked UniFi U6+ access points back">
