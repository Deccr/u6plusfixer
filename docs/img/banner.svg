  <text x="372" y="96" font-size="44" font-weight="800" fill="#f0f6fc">U6+ eMMC Recovery</text>
  <text x="374" y="134" font-size="18" fill="#8b949e">Bring bricked UniFi U6+ access points back to life.</text>
  <text x="374" y="164" font-size="15" fill="#3fb950">One cable · One click · One power-on</text>
</svg>
